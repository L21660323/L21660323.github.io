<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000000;
        }
        h1 {
            margin-top: 20px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            max-width: 90%; /* Max width for responsiveness */
        }
        .gallery img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s; /* Adding transition for scaling effect */
        }
        .gallery img:hover {
            transform: scale(1.05); /* Scale effect on hover */
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s, transform 0.3s; /* Added transform for button */
        }
        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px); /* Elevate button on hover */
        }
    </style>
</head>
<body>
    <h1>Galería de Imágenes</h1>
    <button onclick="loadImages()">Cargar Nuevas Imágenes</button>
    <div class="gallery" id="gallery"></div>

    <script>
        const accessKey = 'Tem6ye4t83pHil0rKW1xgkMm4GA12g4J9HhyuSR0Ft8'; // Reemplaza con tu Access Key de Unsplash

        async function loadImages() {
            const response = await fetch(`https://api.unsplash.com/photos/random?count=9&client_id=${accessKey}`);
            const images = await response.json();
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            images.forEach(image => {
                const imgElement = document.createElement('img');
                imgElement.src = image.urls.small;
                gallery.appendChild(imgElement);
            });
        }

        // Cargar imágenes al cargar la página
        window.onload = loadImages;
    </script>
</body>
</html>
